spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: whatsappOrdering

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/whatsapp_ordering}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null

server:
  port: 8081
  error:
    include-message: always
    include-binding-errors: always

# ─── App-specific properties ──────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:change-this-in-production-must-be-256-bits-long-secret-key}
    expiration-ms: 86400000   # 24 hours

  frontend:
    origin: ${FRONTEND_ORIGIN:http://localhost:5174}

  whatsapp:
    api-url: https://graph.facebook.com/v20.0
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    token: ${WHATSAPP_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:whatsapp_webhook_verify_token}
    session-timeout-minutes: 30

  cloudinary:
    url: ${CLOUDINARY_URL:}

# ─── Actuator ─────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

# ─── SpringDoc / Swagger ──────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    try-it-out-enabled: true
